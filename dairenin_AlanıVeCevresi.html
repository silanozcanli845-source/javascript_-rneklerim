<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkenleri tanımla
        var r,alan,cevre,pi=3.14;

        //yarıçap al 
        r=Number(prompt("yarıçap : "));

        //alan ve çevreyi hesapla
        alan=pi*r*r;
        cevre=2*pi*r;

        //alan ve çevreyi yaz
        alert("çevre: "+cevre+ " alan : "+alan);
    </script>
</body>
</html>
