<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkenler
        var yukseklik,genislik,alan,cevre;

        //değerleri al
        genislik=Number(prompt("genişlik : "));
        yukseklik=Number(prompt("yükseklik : "));

        //alan ve çevre hesabı 
        alan=genislik*yukseklik;
        cevre=2*(genislik+yukseklik);

        alert("çevre : " + cevre+ "alan: " +alan);
    </script>
</body>
</html>
