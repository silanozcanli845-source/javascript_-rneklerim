<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //değişkenleri tanımla
        var sayi,kare;
        //sayı değerini al 
        sayi=Number(prompt("sayı giriniz : "));

        //kare değerini hesapla 
        kare=sayi*sayi;

        //sonucu ekrana yaz
        alert("sayi : " +sayi+"  sayinin karesi : "+kare );
    </script>
</body>
</html>
