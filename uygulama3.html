<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function yazxy(x,y){
            while(x<=y){
                document.write(x+"<br>");
                x++;
            }
        }
        


        var a=Number(prompt("a: "));
         var b=Number(prompt("b: "));


         yazxy(a,b);

    </script>
</body>
</html>
